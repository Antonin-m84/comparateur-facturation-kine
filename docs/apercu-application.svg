<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Apercu du comparateur de facturation kine</title>
  <desc id="desc">Interface montrant deux fichiers Excel importes, les resultats de comparaison et le bouton de telechargement.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9fc"/>
      <stop offset="1" stop-color="#e8f2f3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#17324d" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1400" height="820" fill="url(#background)"/>
  <circle cx="1280" cy="80" r="170" fill="#d5ebe7" opacity=".65"/>
  <circle cx="80" cy="760" r="210" fill="#dce9f4" opacity=".7"/>
  <rect x="70" y="52" width="1260" height="716" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="70" y="52" width="1260" height="52" rx="18" fill="#17324d"/>
  <circle cx="100" cy="78" r="7" fill="#ff8066"/>
  <circle cx="124" cy="78" r="7" fill="#f5c451"/>
  <circle cx="148" cy="78" r="7" fill="#65c49a"/>
  <text x="190" y="84" font-family="Arial, sans-serif" font-size="17" fill="#dceaf2">Comparateur Facturation Kine</text>
  <rect x="70" y="104" width="244" height="664" fill="#f5f8fa"/>
  <text x="100" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Mode d'emploi</text>
  <text x="100" y="190" font-family="Arial, sans-serif" font-size="16" fill="#496273">1. Importer les fichiers</text>
  <text x="100" y="220" font-family="Arial, sans-serif" font-size="16" fill="#496273">2. Choisir les feuilles</text>
  <text x="100" y="250" font-family="Arial, sans-serif" font-size="16" fill="#496273">3. Lancer la comparaison</text>
  <text x="100" y="280" font-family="Arial, sans-serif" font-size="16" fill="#496273">4. Telecharger le rapport</text>
  <line x1="100" y1="320" x2="284" y2="320" stroke="#d5e0e6" stroke-width="2"/>
  <text x="100" y="362" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">Bon a savoir</text>
  <text x="100" y="398" font-family="Arial, sans-serif" font-size="14" fill="#496273">Les fichiers restent traites</text>
  <text x="100" y="422" font-family="Arial, sans-serif" font-size="14" fill="#496273">dans la session Streamlit.</text>
  <rect x="350" y="132" width="930" height="78" rx="12" fill="#f0f6f8"/>
  <text x="390" y="169" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17324d">Comparateur Facturation Kine</text>
  <text x="390" y="195" font-family="Arial, sans-serif" font-size="15" fill="#607786">Verifiez vos actes et reperez rapidement les ecarts.</text>
  <rect x="350" y="236" width="445" height="180" rx="12" fill="#ffffff" stroke="#d7e3e8" stroke-width="2"/>
  <rect x="815" y="236" width="465" height="180" rx="12" fill="#ffffff" stroke="#d7e3e8" stroke-width="2"/>
  <text x="382" y="274" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Votre facturation</text>
  <text x="847" y="274" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Rapport de l'hopital</text>
  <rect x="382" y="298" width="381" height="72" rx="8" fill="#f7fafb" stroke="#9fc1cc" stroke-dasharray="7 6"/>
  <rect x="847" y="298" width="401" height="72" rx="8" fill="#f7fafb" stroke="#9fc1cc" stroke-dasharray="7 6"/>
  <text x="402" y="330" font-family="Arial, sans-serif" font-size="15" fill="#496273">facturation_mars.xlsx</text>
  <text x="402" y="354" font-family="Arial, sans-serif" font-size="13" fill="#65a48e">Fichier charge - Feuille Mars</text>
  <text x="867" y="330" font-family="Arial, sans-serif" font-size="15" fill="#496273">WebRapport_GHDC.xlsx</text>
  <text x="867" y="354" font-family="Arial, sans-serif" font-size="13" fill="#65a48e">Fichier charge - Feuille 1</text>
  <rect x="350" y="440" width="930" height="62" rx="10" fill="#1f8a70"/>
  <text x="815" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Lancer la comparaison</text>
  <text x="350" y="550" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Resultats</text>
  <rect x="350" y="576" width="288" height="86" rx="10" fill="#eff8f4"/>
  <rect x="670" y="576" width="288" height="86" rx="10" fill="#fff7e8"/>
  <rect x="990" y="576" width="290" height="86" rx="10" fill="#fff0ed"/>
  <text x="374" y="608" font-family="Arial, sans-serif" font-size="14" fill="#496273">Appariees</text>
  <text x="374" y="644" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1f8a70">128</text>
  <text x="694" y="608" font-family="Arial, sans-serif" font-size="14" fill="#496273">Manquantes hopital</text>
  <text x="694" y="644" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#b77b18">4</text>
  <text x="1014" y="608" font-family="Arial, sans-serif" font-size="14" fill="#496273">Manquantes chez vous</text>
  <text x="1014" y="644" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#d45f4c">2</text>
  <rect x="350" y="690" width="930" height="44" rx="8" fill="#edf4f6"/>
  <text x="815" y="718" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1f6f73">Telecharger le rapport Excel complet</text>
</svg>
